name: Docs

on:
  push:
    branches: [main]

# GitHub Pages via the native Actions deployment (no gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time -- `group: pages` is a fixed string, not keyed
# on the ref, because there is one site per repository. Never cancel: this
# workflow runs on main only, so every run it starts is one whose result is
# wanted, and it publishes the coverage badge as well as the API docs. The
# Renovate burst of 2026-07-22 cancelled four runs here; each died a few
# seconds in, inside `build`, before it had uploaded anything -- which is the
# timing being lucky, not a guarantee, since the build takes 90-180 s and the
# `deploy` job sits at the end of it. With `false` GitHub still keeps at most
# one running and one pending run, so rapid pushes discard the pending one
# instead of queueing a backlog of deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step must fail fast and name itself: the account's Actions
    # concurrency is 20, and one wedged job is a slot everyone else waits on.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Generate API docs
        run: dart doc --output doc/api

      - name: Generate coverage + badge
        run: |
          dart pub global activate coverage
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --check-ignore
          # Self-hosted coverage badge (Codecov-equivalent), served from Pages
          # at https://sofa-buffers.github.io/corelib-dart/coverage.svg
          dart run tool/gen_coverage_badge.dart coverage/lcov.info doc/api/coverage.svg

      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A hung step must fail fast and name itself: the account's Actions
    # concurrency is 20, and one wedged job is a slot everyone else waits on.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
