name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # `dart format` is not stable across SDK versions -- its line splitting
  # changes -- so running this inside the matrix below asked the repository to
  # be formatted five ways at once, which no file can be. It ran there until
  # 3.13 became stable and re-wrapped a test, at which point the `stable` leg
  # failed on every PR and formatting for it would have failed the other four.
  # One SDK, one answer: `stable`, because that is what a contributor's local
  # `dart format` is. When the formatter changes again this is one job to
  # re-run and one reformat commit, instead of an unsatisfiable matrix.
  format:
    runs-on: ubuntu-latest
    # A hung step must fail fast and name itself: the account's Actions
    # concurrency is 20, and one wedged job is a slot everyone else waits on.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # `dart format` reads the package's language version out of
      # .dart_tool/package_config.json, and formats to a DIFFERENT default
      # without it — 9 files here. It also needs the resolution to follow the
      # `package:lints` include in analysis_options.yaml. So the gate resolves
      # first, exactly as the matrix job below does.
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      # Dart has no compile step short of AOT, so `dart analyze` is this
      # repository's build gate. It used to run inside the matrix below, where
      # an analysis error — which is SDK-independent for the versions we
      # support — was reported five times for one cause, and each of the five
      # legs had already paid for a checkout and a resolve to say it. It runs
      # once here instead, and `build-test` waits on this job, so a repository
      # that does not analyse never reaches the test matrix at all.
      - run: dart analyze --fatal-infos

  build-test:
    runs-on: ubuntu-latest
    # Format and analysis are SDK-independent and cheap; gating on them keeps
    # five SDK legs from burning runners on a tree that does not analyse.
    needs: [format]
    # A hung step must fail fast and name itself: the account's Actions
    # concurrency is 20, and one wedged job is a slot everyone else waits on.
    timeout-minutes: 20
    strategy:
      # Dart is a single-vendor, stable toolchain, but scripting-style
      # version drift can still bite, so we test every currently-common minor
      # from our floor up to current stable. The 3.8 floor is set by lints v6
      # (dev dep), which requires SDK >=3.8.0; nothing older can resolve.
      fail-fast: false
      matrix:
        sdk: ["3.8", "3.9", "3.10", "3.11", stable]
    name: build & test (Dart ${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Run tests (shared vectors + streaming + malformed + truncation)
        run: dart test

      # The README's entry point, on every SDK in the matrix: it exercises the
      # generated-object layer end to end (§6.1) and is the one executable this
      # repo ships that is not a benchmark tool. The benchmark tools are not
      # run here -- `dart test` above already runs them itself
      # (bench_grammar_test.dart) and matches their output against BENCH_SPEC's
      # grammar, so a second run proved nothing the suite had not.
      - name: Sanity-run the example (debug — JIT)
        run: dart run example/person.dart

      # §12.1 step 4 wants *both* configurations built. Everything above runs on
      # the JIT VM, which for Dart is the debug configuration; the release
      # configuration is AOT (`dart compile exe`). This step builds it.
      #
      # It used to get there by running bench/run_bench.sh and
      # bench/run_callgrind.sh, which also MEASURE — and the measuring is what
      # wedged: 77 seconds when the leg was last green, then 45+ minutes with no
      # output, on every PR, holding a runner the whole time (#70). Installing
      # valgrind over apt with no timeout was the other unbounded half. #72
      # dropped the measuring and kept an AOT compile of the three benchmark
      # entrypoints.
      #
      # Those entrypoints are gone from here too: compiling them checks the
      # benchmark tooling, not the library, and CORELIB_PLAN asks for no
      # benchmark work in CI at all (§12.1's required steps list none; §13
      # wants the tools present and runnable, a property of the repo rather
      # than of a workflow run). What §12.1 step 4 does require is that the
      # release configuration is built, so the example is compiled and run
      # ahead-of-time instead — the same AOT toolchain, on the code the
      # library's users actually run. Output lands in build/, which is
      # git-ignored.
      - name: Build release (AOT)
        if: matrix.sdk == 'stable'
        timeout-minutes: 10
        run: |
          mkdir -p build
          dart compile exe example/person.dart -o build/person
          build/person

  coverage:
    runs-on: ubuntu-latest
    needs: build-test
    # A hung step must fail fast and name itself: the account's Actions
    # concurrency is 20, and one wedged job is a slot everyone else waits on.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Collect coverage
        run: |
          dart pub global activate coverage
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --check-ignore
      - name: Enforce >90% line coverage (CORELIB_PLAN §7.3)
        run: |
          PCT=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "%.1f", (lh/lf)*100}' coverage/lcov.info)
          echo "Line coverage: ${PCT}%"
          echo "coverage=${PCT}" >> "$GITHUB_STEP_SUMMARY"
          awk "BEGIN{exit !(${PCT} > 90)}" \
            || { echo "::error::coverage ${PCT}% is not above the 90% bar"; exit 1; }
      - name: Upload coverage report (lcov)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
      # The rendered coverage badge is generated and published to GitHub Pages by
      # docs.yml (self-hosted, Codecov-equivalent per §12.1); the README badge
      # points at https://sofa-buffers.github.io/corelib-dart/coverage.svg
