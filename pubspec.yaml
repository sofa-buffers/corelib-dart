# The pub name is the organization slug `sofa-buffers` plus `corelib`,
# transliterated into pub.dev's required lowercase_with_underscores form — the
# same derivation every other port satisfies, and byte-identical to corelib-zig's
# `sofa_buffers_corelib`. Users import it and alias the public surface to the
# fixed `sofab` namespace:
#   import 'package:sofa_buffers_corelib/sofa_buffers_corelib.dart' as sofab;
name: sofa_buffers_corelib
description: >-
  SofaBuffers — a compact, self-describing, fully streamable binary
  serialization format. High-speed Dart core library (corelib-dart).
version: 0.10.0
repository: https://github.com/sofa-buffers/corelib-dart
homepage: https://github.com/sofa-buffers

environment:
  sdk: ^3.8.0

# No runtime dependencies — the library uses only dart:core and dart:typed_data.
dev_dependencies:
  test: ^1.25.0
  coverage: ^1.9.0
  lints: ^6.0.0
